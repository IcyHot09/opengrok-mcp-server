name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm config delete always-auth --location=user 2>/dev/null || true
      - run: npm ci
      # grammars/ is gitignored: populate it from node_modules so vitest's
      # tree-sitter resolution (getGrammarDir walk-up) finds grammar WASMs.
      # (out/grammars/ from compile is a fallback, also probed by getGrammarDir.)
      - run: npm run copy-grammars
      - run: npm run lint
      - run: npm run compile
      - run: npm run test:coverage

      - name: Build
        run: npm run package
